<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blood Bowl</title>
  <!-- STATIC_INJECT -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Welcome screen ─────────────────────────────────────── -->
<div id="screen-welcome" class="screen">
  <h1>Blood Bowl</h1>
  <button onclick="onClickLocalGame();">Local Game</button>
</div>

<!-- ── Team select screen ──────────────────────────────────── -->
<div id="screen-team-select" class="screen hidden">
  <h2>Local Game</h2>

  <div class="ts-section">
    <div class="ts-section-title ts-home-label">Home</div>
    <div class="team-choice-group" id="tcg-home">
      <button class="team-choice-btn selected" data-race="humans" onclick="selectTeam('home','humans')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Humans">
          <span class="tcb-race">Humans</span>
          <span class="tcb-name">Reavers</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="orcs" onclick="selectTeam('home','orcs')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Orcs">
          <span class="tcb-race">Orcs</span>
          <span class="tcb-name">Warbosses</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="skaven" onclick="selectTeam('home','skaven')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Skaven">
          <span class="tcb-race">Skaven</span>
          <span class="tcb-name">Vermintide</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="dwarfs" onclick="selectTeam('home','dwarfs')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Dwarfs">
          <span class="tcb-race">Dwarfs</span>
          <span class="tcb-name">Grudgebearers</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="imperialnobility" onclick="selectTeam('home','imperialnobility')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Imperial Nobility">
          <span class="tcb-race">Nobility</span>
          <span class="tcb-name">Gilded Guard</span>
        </div>
      </button>
    </div>
  </div>

  <div class="ts-section">
    <div class="ts-section-title ts-away-label">Away</div>
    <div class="team-choice-group" id="tcg-away">
      <button class="team-choice-btn" data-race="humans" onclick="selectTeam('away','humans')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Humans">
          <span class="tcb-race">Humans</span>
          <span class="tcb-name">Reavers</span>
        </div>
      </button>
      <button class="team-choice-btn selected" data-race="orcs" onclick="selectTeam('away','orcs')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Orcs">
          <span class="tcb-race">Orcs</span>
          <span class="tcb-name">Warbosses</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="skaven" onclick="selectTeam('away','skaven')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Skaven">
          <span class="tcb-race">Skaven</span>
          <span class="tcb-name">Vermintide</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="dwarfs" onclick="selectTeam('away','dwarfs')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Dwarfs">
          <span class="tcb-race">Dwarfs</span>
          <span class="tcb-name">Grudgebearers</span>
        </div>
      </button>
      <button class="team-choice-btn" data-race="imperialnobility" onclick="selectTeam('away','imperialnobility')">
        <div class="tcb-bar"></div>
        <div class="tcb-body">
          <img class="tcb-logo" alt="Imperial Nobility">
          <span class="tcb-race">Nobility</span>
          <span class="tcb-name">Gilded Guard</span>
        </div>
      </button>
    </div>
  </div>

  <button class="ts-kickoff-btn" onclick="onClickStartLocalGame();">Kick Off</button>
  <button class="ts-back-btn" onclick="showScreen('welcome');">← Back</button>
</div>

<!-- ── Waiting screen ─────────────────────────────────────── -->
<div id="screen-waiting" class="screen hidden">
  <h2>Waiting for opponent…</h2>
  <p>You are: <strong id="lbl-room-side"></strong></p>
</div>

<!-- ── Game screen ────────────────────────────────────────── -->
<div id="screen-game" class="screen hidden">

  <!-- Status strip — always visible on both mobile and desktop -->
  <div id="status-strip">
    <div class="ss-team ss-home" onclick="toggleRosterPanel('home')" title="HOME">
      <span class="ss-rerolls team-home" id="ss-rr-home"></span>
      <span class="ss-bribes team-home" id="ss-br-home"></span>
      <span class="ss-logo" id="ss-logo-home"></span>
      <span class="ss-score team-home" id="ss-score-home">0</span>
    </div>
    <div class="ss-center">
      <span id="ss-phase-label"></span>
      <span id="ss-turn-label"></span>
    </div>
    <div class="ss-team ss-away" onclick="toggleRosterPanel('away')" title="AWAY">
      <span class="ss-score team-away" id="ss-score-away">0</span>
      <span class="ss-logo" id="ss-logo-away"></span>
      <span class="ss-bribes team-away" id="ss-br-away"></span>
      <span class="ss-rerolls team-away" id="ss-rr-away"></span>
    </div>
    <button class="ss-log-btn" onclick="toggleMobileLog()">☰</button>
  </div>

<div id="layout">

  <!-- Canvas -->
  <div id="pitch-wrap">
    <canvas id="pitch"></canvas>
    <div id="turn-toast"></div>
  </div>

  <!-- Right: info + log + actions -->
  <div class="sidebar" id="sidebar-right">

    <div class="section" id="section-player-editor" style="display:none;">
      <div class="section-title">Player Editor</div>
      <div id="player-editor-name"></div>
      <div id="player-editor-stats"></div>
      <div class="skill-chips" id="skill-chips"></div>
      <div id="player-editor-add">
        <select id="skill-select"></select>
        <button id="btn-add-skill" onclick="addSkillToSelected()">+ Add</button>
      </div>
    </div>

    <div class="section" id="section-log">
      <div class="section-title">Match Log</div>
      <div id="log"></div>
    </div>

    <div id="action-bar">
      <button id="btn-throw"         class="action-btn success"  onclick="onClickThrow();"       style="display:none;">Throw</button>
      <button id="btn-no-intercept"  class="action-btn"          onclick="onClickNoIntercept();" style="display:none;">No Intercept</button>
      <button id="btn-reroll-block"  class="action-btn"          onclick="onClickRerollBlock();" style="display:none;">Reroll</button>
      <button id="btn-pro-block"     class="action-btn"          onclick="onClickProBlock();"    style="display:none;">Pro</button>
      <button id="btn-cancel"        class="action-btn"          onclick="onClickCancel();"      style="display:none;">Cancel</button>
      <button id="btn-stop"          class="action-btn success"  onclick="onClickStop();"        style="display:none;">Stop</button>
      <button id="btn-confirm-setup"         class="action-btn success"  onclick="onClickConfirmSetup();"         style="display:none;">Confirm Setup</button>
      <button id="btn-solid-defence-confirm" class="action-btn success"  onclick="onClickSolidDefenceConfirm();"   style="display:none;">Confirm Defence</button>
      <button id="btn-quicksnap-confirm"     class="action-btn success"  onclick="onClickQuickSnapConfirm();"      style="display:none;">Done Moving</button>
      <button id="btn-charge-confirm"        class="action-btn success"  onclick="onClickChargeConfirm();"         style="display:none;">Continue Kick</button>
      <button id="btn-highkick-skip"         class="action-btn"          onclick="onClickHighKickSkip();"          style="display:none;">Skip High Kick</button>
      <button id="btn-end-turn"              class="action-btn end-turn" onclick="onClickEndTurn();">End Turn</button>
      <button id="btn-debug"                 class="action-btn debug-btn" onclick="toggleDebugMode();">Debug</button>
    </div>

  </div>
</div>
  <!-- Mobile HUD — visible only on narrow screens (CSS) -->
  <div id="mobile-hud">
    <div id="mobile-bottom-bar">
      <button id="mobile-btn-cancel"         class="action-btn"         onclick="onClickCancel();"        style="display:none">Cancel</button>
      <button id="mobile-btn-throw"          class="action-btn success" onclick="onClickThrow();"         style="display:none">Throw</button>
      <button id="mobile-btn-no-intercept"   class="action-btn"         onclick="onClickNoIntercept();"   style="display:none">No Intercept</button>
      <button id="mobile-btn-reroll-block"   class="action-btn"         onclick="onClickRerollBlock();"   style="display:none">Reroll</button>
      <button id="mobile-btn-pro-block"      class="action-btn"         onclick="onClickProBlock();"      style="display:none">Pro</button>
      <button id="mobile-btn-stop"           class="action-btn success" onclick="onClickStop();"          style="display:none">Stop</button>
      <button id="mobile-btn-confirm-setup"         class="action-btn success"  onclick="onClickConfirmSetup();"         style="display:none">Confirm Setup</button>
      <button id="mobile-btn-solid-defence-confirm" class="action-btn success"  onclick="onClickSolidDefenceConfirm();"   style="display:none">Confirm Defence</button>
      <button id="mobile-btn-quicksnap-confirm"     class="action-btn success"  onclick="onClickQuickSnapConfirm();"      style="display:none">Done Moving</button>
      <button id="mobile-btn-charge-confirm"        class="action-btn success"  onclick="onClickChargeConfirm();"         style="display:none">Continue Kick</button>
      <button id="mobile-btn-highkick-skip"         class="action-btn"          onclick="onClickHighKickSkip();"          style="display:none">Skip High Kick</button>
      <button id="mobile-btn-end-turn"              class="action-btn end-turn" onclick="onClickEndTurn();">End Turn</button>
    </div>
  </div>

  <!-- Toss overlay — shown at the start of each drive -->
  <div id="toss-overlay" style="display:none;">
    <div id="toss-card">
      <div id="toss-winner-label"></div>
      <div id="toss-body">
        <div id="toss-subtitle">Choose your role for this drive</div>
        <div id="toss-buttons">
          <button class="toss-btn" onclick="onTossChoose('kick')">Kick</button>
          <button class="toss-btn" onclick="onTossChoose('receive')">Receive</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reconnect overlay — shown when opponent drops mid-game -->
  <div id="reconnect-overlay" class="hidden">
    <div id="reconnect-box">
      <div id="reconnect-msg">Opponent disconnected</div>
      <div id="reconnect-sub">Waiting for them to reconnect…</div>
    </div>
  </div>

  <!-- Mobile log panel -->
  <div id="mobile-log-panel" class="hidden">
    <div id="mobile-log-header">
      <span>Match Log</span>
      <button onclick="toggleMobileLog()">✕</button>
    </div>
    <div id="mobile-log-copy"></div>
  </div>

  <!-- Roster panel — edge-anchored, slides in during setup phases -->
  <div id="roster-panel">
    <div id="roster-header">
      <span id="roster-title">DUGOUT</span>
      <span id="roster-team-stats"></span>
    </div>
    <div id="roster-body">
      <div id="roster-list"></div>
      <div id="roster-demote-zone" data-demote-zone="true">← BENCH</div>
    </div>
  </div>

</div><!-- /screen-game -->

<!-- Floating chip info tooltip — shared, repositioned per chip -->
<div id="chip-tooltip" class="chip-tooltip" hidden></div>


<!-- Hidden file inputs for custom team loading -->
<input type="file" id="file-home" accept=".json" style="display:none">
<input type="file" id="file-away" accept=".json" style="display:none">

<script>var G = {};</script> <!-- the Game State -->
<script src="engine/helpers.js"></script>
<script src="engine/core.js"></script>
<script src="engine/dice.js"></script>
<!-- resolution layer (split from the former actions.js) -->
<script src="engine/resolve.js"></script>
<script src="engine/block.js"></script>
<script src="engine/move.js"></script>
<script src="engine/pass.js"></script>
<script src="engine/kickoff.js"></script>
<script src="engine/special.js"></script>
<script src="engine/teams.js"></script>
<script src="engine/truth.js"></script>
<script src="client/sprites.js"></script>
<script src="client/render.js"></script>
<script src="client/input.js"></script>
<script src="client/network.js"></script>
<script src="client/game.js"></script>
<script src="client/welcome.js"></script>

<script>
  Promise.all([
      fetch('team-humans.json').then(r => r.json()),
      fetch('team-orcs.json').then(r => r.json()),
      fetch('team-skaven.json').then(r => r.json()),
      fetch('team-dwarfs.json').then(r => r.json()),
      fetch('team-imperialnobility.json').then(r => r.json()),
  ]).then(([humans, orcs, skaven, dwarfs, imperialnobility]) => startApp({ humans, orcs, skaven, dwarfs, imperialnobility }));
</script>
</body>
</html>
